<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cockpit da IA</title>
    <link rel="stylesheet" href="cockpit.css?v=2" />
    <link rel="stylesheet" href="nav-rail.css?v=1" />
  </head>
  <body class="cockpit" data-coluna="agentes">
    <nav id="rail"></nav>
    <div class="tela">
      <header class="topo">
        <div class="topo-esq">
          <h1>Cockpit da IA</h1>
          <nav class="abas" role="tablist" aria-label="Vistas">
            <button role="tab" type="button" data-aba="painel">Painel</button>
            <button role="tab" type="button" data-aba="mapa">Mapa</button>
            <button role="tab" type="button" data-aba="hoje">Hoje</button>
          </nav>
        </div>
        <div class="topo-dir">
          <div class="vivo" id="vivo" title="A tela se atualiza sozinha a cada 30 s"><span class="pulso" aria-hidden="true"></span><span id="vivoTexto">carregando&hellip;</span></div>
          <label class="busca"><span class="sr">Buscar</span><input id="busca" type="search" placeholder="Buscar agente, rotina ou item" autocomplete="off" /><kbd>/</kbd></label>
          <button id="atualizar" class="botao" type="button" title="Ler o Copiloto agora (atalho: r)">Atualizar</button>
        </div>
      </header>
      <section class="kpis" id="kpis" aria-label="Resumo"></section>
      <div id="aviso" class="aviso" role="alert" hidden></div>
      <div id="alertas" class="estado-leitura" aria-live="polite"></div>
      <main class="conteudo">
        <section id="aba-painel" class="aba">
          <div class="colunas-abas segmentos" role="group" aria-label="Coluna">
            <button type="button" data-coluna="agentes">Agentes</button>
            <button type="button" data-coluna="voce">Voc&ecirc;</button>
            <button type="button" data-coluna="rotinas">Rotinas</button>
          </div>
          <div class="colunas">
            <section class="coluna" aria-labelledby="t-agentes" id="coluna-agentes">
              <header class="coluna-topo"><h2 id="t-agentes">Agentes</h2><span id="n-agentes" class="contagem"></span></header>
              <div id="agentes" class="lista"></div>
            </section>
            <section class="coluna" aria-labelledby="t-voce" id="coluna-voce">
              <header class="coluna-topo"><h2 id="t-voce">Voc&ecirc;</h2><span id="n-voce" class="contagem"></span></header>
              <div id="voce-filtros" class="segmentos" role="group" aria-label="Tipo de item"></div>
              <div id="voce" class="lista"></div>
            </section>
            <section class="coluna" aria-labelledby="t-rotinas" id="coluna-rotinas">
              <header class="coluna-topo"><h2 id="t-rotinas">Rotinas</h2><span id="n-rotinas" class="contagem"></span></header>
              <div id="rotinas-filtros" class="segmentos" role="group" aria-label="Segmento"></div>
              <div id="linha-dia" class="linha-dia" aria-hidden="true"></div>
              <div id="rotinas" class="lista"></div>
            </section>
          </div>
        </section>
        <section id="aba-mapa" class="aba" hidden>
          <div class="mapa-caixa"><svg id="mapa" viewBox="0 0 1100 660" role="img" aria-label="Mapa dos agentes, da fila e das rotinas"></svg></div>
          <p class="legenda" id="legenda"></p>
        </section>
        <section id="aba-hoje" class="aba" hidden><div id="hoje"></div></section>
      </main>
    </div>
    <div id="veu" class="veu" hidden></div>
    <aside id="gaveta" class="gaveta" aria-hidden="true" aria-label="Detalhe">
      <button class="fechar" id="fecharGaveta" type="button" aria-label="Fechar">&times;</button>
      <div id="gavetaCorpo"></div>
    </aside>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="nav-rail.js?v=1"></script>
    <script src="cockpit-view.js?v=1"></script>
    <script src="cockpit.js?v=2"></script>
  </body>
</html>
